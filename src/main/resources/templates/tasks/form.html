<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title th:text="${taskId == null} ? 'Créer une tâche | TaskFlow' : 'Modifier une tâche | TaskFlow'">
    Formulaire | TaskFlow
  </title>

  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="container">

  <section class="form-page">

    <div class="page-header">
      <div>
        <h1 th:text="${taskId == null} ? 'Créer une tâche' : 'Modifier une tâche'">
          Formulaire
        </h1>

        <p class="page-subtitle">
          Renseignez les informations de votre tâche.
        </p>
      </div>
    </div>

    <div class="card form-card">

      <form th:object="${task}"
            th:action="${taskId == null} ? @{/tasks} : @{/tasks/{id}(id=${taskId})}"
            method="post">

        <!-- Titre -->
        <div class="form-group">

          <label for="title">
            Titre <span class="required">*</span>
          </label>

          <input type="text"
                 id="title"
                 th:field="*{title}"
                 class="form-control"
                 th:classappend="${#fields.hasErrors('title')} ? ' is-invalid'"
                 placeholder="Ex. : Terminer le projet Spring Boot"
                 maxlength="150"
                 required>

          <p class="field-error"
             th:if="${#fields.hasErrors('title')}"
             th:errors="*{title}">
          </p>

        </div>

        <!-- Description -->
        <div class="form-group">

          <label for="description">
            Description
          </label>

          <textarea id="description"
                    th:field="*{description}"
                    class="form-control"
                    rows="5"
                    placeholder="Décrivez votre tâche..."></textarea>

        </div>

        <!-- Date d'échéance -->
        <div class="form-group">

          <label for="dueDate">
            Date d'échéance
          </label>

          <input type="date"
                 id="dueDate"
                 th:field="*{dueDate}"
                 class="form-control">

          <p class="field-error"
             th:if="${#fields.hasErrors('dueDate')}"
             th:errors="*{dueDate}">
          </p>

        </div>

        <!-- Statut -->
        <div class="form-group">

          <label for="status">
            Statut
          </label>

          <select id="status"
                  th:field="*{status}"
                  class="form-control">

            <option th:each="status : ${statuses}"
                    th:value="${status}"
                    th:text="${status.name() == 'TO_DO'} ? 'À faire' : (${status.name() == 'IN_PROGRESS'} ? 'En cours' : 'Terminée')">
            </option>

          </select>

          <p class="field-error"
             th:if="${#fields.hasErrors('status')}"
             th:errors="*{status}">
          </p>

        </div>

        <!-- Actions -->
        <div class="form-actions">

          <a th:href="@{/tasks}"
             class="btn btn-secondary">
            Annuler
          </a>

          <button type="submit"
                  class="btn btn-primary"
                  th:text="${taskId == null} ? 'Créer la tâche' : 'Enregistrer les modifications'">
            Enregistrer
          </button>

        </div>

      </form>

    </div>

  </section>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/js/app.js}" defer></script>

</body>
</html>
