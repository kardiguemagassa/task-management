
<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title th:text="${taskId == null} ? #{form.create.title} + ' | TaskFlow' : #{form.edit.title} + ' | TaskFlow'">
    Formulaire | TaskFlow
  </title>

  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="container">

  <section class="page-header">
    <div>
      <h1 th:text="${taskId == null} ? #{form.create.title} : #{form.edit.title}">
        Créer une tâche
      </h1>

      <p class="page-subtitle"
         th:text="${taskId == null} ? #{form.create.subtitle} : #{form.edit.subtitle}">
        Renseignez les informations de votre tâche.
      </p>
    </div>
  </section>

  <section class="form-page">

    <div class="form-card">

      <form th:object="${task}"
            th:action="${taskId == null} ? @{/tasks} : @{/tasks/{id}(id=${taskId})}"
            method="post">

        <!-- Titre -->
        <div class="form-group">

          <label for="title" th:text="#{task.title}">
            Titre
          </label>

          <input type="text"
                 id="title"
                 th:field="*{title}"
                 class="form-control"
                 th:placeholder="#{form.title.placeholder}"
                 maxlength="150"
                 required>

          <div th:if="${#fields.hasErrors('title')}"
               class="field-error"
               th:errors="*{title}">
          </div>

        </div>

        <!-- Description -->
        <div class="form-group">

          <label for="description"
                 th:text="#{task.description}">
            Description
          </label>

          <textarea id="description"
                    th:field="*{description}"
                    class="form-control"
                    th:placeholder="#{form.description.placeholder}"
                    rows="5"></textarea>

          <div th:if="${#fields.hasErrors('description')}"
               class="field-error"
               th:errors="*{description}">
          </div>

        </div>

        <!-- Échéance -->
        <div class="form-group">

          <label for="dueDate"
                 th:text="#{task.dueDate}">
            Échéance
          </label>

          <input type="date"
                 id="dueDate"
                 th:field="*{dueDate}"
                 class="form-control">

          <div th:if="${#fields.hasErrors('dueDate')}"
               class="field-error"
               th:errors="*{dueDate}">
          </div>

        </div>

        <!-- Statut -->
        <div class="form-group">

          <label for="status"
                 th:text="#{task.status}">
            Statut
          </label>

          <select id="status"
                  th:field="*{status}"
                  class="form-control"
                  required>

            <option value=""
                    th:text="#{form.status.select}">
              Choisissez un statut
            </option>

            <option th:each="status : ${statuses}"
                    th:value="${status}"
                    th:text="${status.name() == 'TO_DO'} ? #{task.status.todo} : (${status.name() == 'IN_PROGRESS'} ? #{task.status.progress} : #{task.status.done})">
            </option>

          </select>

          <div th:if="${#fields.hasErrors('status')}"
               class="field-error"
               th:errors="*{status}">
          </div>

        </div>

        <!-- Actions -->
        <div class="form-actions">

          <a th:href="@{/tasks}"
             class="btn btn-secondary"
             th:text="#{task.cancel}">
            Annuler
          </a>

          <button type="submit"
                  class="btn btn-primary"
                  th:text="${taskId == null} ? #{form.create.button} : #{task.save}">
            Enregistrer
          </button>

        </div>

      </form>

    </div>

  </section>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/js/app.js}" defer></script>

</body>
</html>
